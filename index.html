<!doctype html>
<html lang="es">
<head>

<body>
  <main>
    <h1>¿Dónde están mis pantalones?</h1>
    <p class="subtitulo">
      De <em>"Honey, ¿Dónde están mis pantalones?"</em>, el programa favorito de Bricksburg en
      <em>La película de Lego</em> (2014). Hacé la pregunta y fijate qué contesta el universo.
    </p>

    <button id="preguntar">¿Dónde están mis pantalones?</button>

    <div id="escenario"></div>
  </main>

  <div class="calle" aria-hidden="true">
    <div class="viandante figura">
      <svg viewBox="0 0 60 90" width="42" height="63">
        <circle class="cabeza" cx="30" cy="14" r="11" />
        <circle class="ojo" cx="26" cy="12" r="1.6" />
        <circle class="ojo" cx="34" cy="12" r="1.6" />
        <rect class="torso" x="16" y="26" width="28" height="30" rx="8" />
        <rect class="brazo brazo-i" x="10" y="28" width="8" height="24" rx="4" />
        <rect class="brazo brazo-d" x="42" y="28" width="8" height="24" rx="4" />
        <rect class="pierna pierna-i" x="19" y="54" width="9" height="28" rx="4" />
        <rect class="pierna pierna-d" x="32" y="54" width="9" height="28" rx="4" />
      </svg>
      <span class="globo-pregunta">?</span>
    </div>

    <div class="viandante pantalon">
      <svg viewBox="0 0 60 70" width="40" height="47">
        <rect class="cintura" x="12" y="4" width="36" height="14" rx="6" />
        <rect class="pierna pierna-i" x="14" y="16" width="14" height="46" rx="6" />
        <rect class="pierna pierna-d" x="32" y="16" width="14" height="46" rx="6" />
      </svg>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
